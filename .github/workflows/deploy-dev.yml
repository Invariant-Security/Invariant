# Roda no self-hosted runner da VPS, em todo push na dev -- staging pra
# teste.invariantsec.org, separado do stack sempre-ligado de main
# (deploy.yml). Ver deploy/docker-compose.dev.yml pro porque do checkout
# dedicado.
name: deploy-dev

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-invariant-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-dev
    runs-on: [self-hosted, vps-prod]
    env:
      SRC_DIR: /srv/projects/publicado/invariant-dev
      REPO: Invariant-Security/Invariant
    steps:
      - name: Atualizar código de staging
        run: |
          # safe.directory: o runner roda como root e o repo tem .git de outro dono (victor)
          git config --global --add safe.directory "$SRC_DIR"
          cd "$SRC_DIR"
          OLD_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
          echo "OLD_SHA=$OLD_SHA" >> "$GITHUB_ENV"
          git fetch "https://x-access-token:${{ github.token }}@github.com/${REPO}.git" dev
          git reset --hard FETCH_HEAD

      # api e web sao containers independentes (sem depends_on entre eles) --
      # so reconstroi o(s) que realmente mudou, pra um push so no frontend
      # nao derrubar/reconstruir o backend (e vice-versa), e pra uma falha
      # de build de um lado nao bloquear um deploy do outro lado que nao
      # tinha nada a ver. Ver deploy/detect_changed_services.sh.
      - name: Descobrir quais servicos mudaram
        id: changed
        run: |
          cd "$SRC_DIR"
          SERVICES="$(deploy/detect_changed_services.sh "$OLD_SHA" "$(git rev-parse HEAD)")"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

      - name: Rebuild e subir os containers (aguarda ficar healthy)
        if: steps.changed.outputs.services != ''
        run: |
          cd "$SRC_DIR"
          docker compose -f deploy/docker-compose.dev.yml up -d --build --wait --wait-timeout 180 ${{ steps.changed.outputs.services }}

      - name: Logs em caso de falha
        if: failure()
        run: |
          cd "$SRC_DIR"
          docker compose -f deploy/docker-compose.dev.yml logs --tail=80 || true
