# Isolated infra for quickdemo.sh's in-person, offline live demo -- entirely
# separate from infra/docker-compose.yml (never edited by this file) so the
# 6 dev/test containers real integration tests depend on
# (tests/assessment/test_assess_target.py, tests/assessment/test_facts.py)
# are never touched. Every container name here is prefixed
# `invariant-demo-*` so it can never collide with the 6 `invariant-*`
# dev/test containers.
#
# Run from repo root: docker compose -f infra/docker-compose.quickdemo.yml up -d
# (images must already be built locally -- quickdemo.sh's preflight checks
# for that; this file intentionally has no `build:` fallback network
# surprise mid-demo beyond what's already cached).

services:
  # The demo's clean baseline: hardened, 0 FAIL on the demo-eligible check
  # subset (see docs/architecture/checks.md).
  demo-ubuntu-hardened:
    image: quickdemo-ubuntu-hardened:latest
    build: ./docker/quickdemo-ubuntu-hardened
    container_name: invariant-demo-ubuntu-hardened

  # The 4 "problem" containers -- start from the hardened images, then get
  # 2-3 randomly-applied misconfigs from scripts/quickdemo/apply_misconfigs.py
  # (not baked into the image, so the story is different every run).
  demo-debian-1:
    image: quickdemo-debian-hardened:latest
    build: ./docker/quickdemo-debian-hardened
    container_name: invariant-demo-debian-1

  demo-debian-2:
    image: quickdemo-debian-hardened:latest
    build: ./docker/quickdemo-debian-hardened
    container_name: invariant-demo-debian-2

  demo-ubuntu-1:
    image: quickdemo-ubuntu-hardened:latest
    build: ./docker/quickdemo-ubuntu-hardened
    container_name: invariant-demo-ubuntu-1

  demo-ubuntu-2:
    image: quickdemo-ubuntu-hardened:latest
    build: ./docker/quickdemo-ubuntu-hardened
    container_name: invariant-demo-ubuntu-2
