# Isolated infra for demo.sh's in-person, offline live demo -- entirely
# separate from infra/docker-compose.yml (never edited by this file) so the
# 6 dev/test containers real integration tests depend on
# (tests/assessment/test_assess_target.py, tests/assessment/test_facts.py)
# are never touched. Every container name here is prefixed
# `invariant-demo-*` so it can never collide with the 6 `invariant-*`
# dev/test containers.
#
# Run from repo root: docker compose -f infra/docker-compose.demo.yml up -d
# (images must already be built locally -- demo.sh's preflight checks for
# that; this file intentionally has no `build:` fallback network surprise
# mid-demo beyond what's already cached).

services:
  # The demo's clean baseline: hardened, only the genuine "impossible in an
  # unprivileged container" gaps FAIL (see docs/architecture/checks.md and
  # scripts/demo/misconfig_catalog.py's CONTAINER_IMPOSSIBLE_TITLES).
  # `tmpfs`/`volumes` on all 6 (checks-backlog.md Group C's partition
  # family): see infra/docker-compose.yml's own comment above its 6
  # services for why /var itself is deliberately excluded (dpkg/apt state).
  # /var/log/audit gets an explicit mode here (unlike the plain dev/test
  # containers) because these hardened images actually install auditd --
  # its package-shipped /var/log/audit is mode 0750 group adm, and "Ensure
  # the audit log file directory mode is configured" (already-implemented,
  # not part of Group C) reads that directory's own mode; Docker's tmpfs
  # default for a path it doesn't special-case is 0755, which fails that
  # check's "none of 0027 set" requirement (world-readable). No plain
  # dev/test container has auditd installed, so this mode override is only
  # needed here.
  demo-ubuntu-hardened:
    image: demo-ubuntu-hardened:latest
    build: ./docker/demo-ubuntu-hardened
    container_name: invariant-demo-ubuntu-hardened
    tmpfs: [/tmp, /home, /var/tmp, /var/log]
    volumes:
      - type: tmpfs
        target: /var/log/audit
        tmpfs: {mode: 0750}

  # The 5 "problem" containers -- start from the hardened images, then get
  # 2-3 randomly-applied misconfigs from scripts/demo/apply_misconfigs.py
  # (not baked into the image, so the story is different every run).
  demo-debian-1:
    image: demo-debian-hardened:latest
    build: ./docker/demo-debian-hardened
    container_name: invariant-demo-debian-1
    tmpfs: [/tmp, /home, /var/tmp, /var/log]
    volumes:
      - type: tmpfs
        target: /var/log/audit
        tmpfs: {mode: 0750}

  demo-debian-2:
    image: demo-debian-hardened:latest
    build: ./docker/demo-debian-hardened
    container_name: invariant-demo-debian-2
    tmpfs: [/tmp, /home, /var/tmp, /var/log]
    volumes:
      - type: tmpfs
        target: /var/log/audit
        tmpfs: {mode: 0750}

  demo-debian-3:
    image: demo-debian-hardened:latest
    build: ./docker/demo-debian-hardened
    container_name: invariant-demo-debian-3
    tmpfs: [/tmp, /home, /var/tmp, /var/log]
    volumes:
      - type: tmpfs
        target: /var/log/audit
        tmpfs: {mode: 0750}

  demo-ubuntu-1:
    image: demo-ubuntu-hardened:latest
    build: ./docker/demo-ubuntu-hardened
    container_name: invariant-demo-ubuntu-1
    tmpfs: [/tmp, /home, /var/tmp, /var/log]
    volumes:
      - type: tmpfs
        target: /var/log/audit
        tmpfs: {mode: 0750}

  demo-ubuntu-2:
    image: demo-ubuntu-hardened:latest
    build: ./docker/demo-ubuntu-hardened
    container_name: invariant-demo-ubuntu-2
    tmpfs: [/tmp, /home, /var/tmp, /var/log]
    volumes:
      - type: tmpfs
        target: /var/log/audit
        tmpfs: {mode: 0750}
