[project]
name = "invariant"
version = "0.1.0"
description = "Versioned knowledge ingestion, extraction and change-tracking platform for security and infrastructure guidance documents."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "psycopg[binary]",
    "typer",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
invariant = "invariant.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant"]
