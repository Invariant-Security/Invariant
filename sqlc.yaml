# sqlc configuration: generates typed Go from sql/queries against the
# schema in sql/schema, into internal/storage/postgres.
# See https://docs.sqlc.dev/en/stable/reference/config.html
version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "sql/schema"
    gen:
      go:
        package: "postgres"
        out: "internal/storage/postgres"
